<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GovBabu Monitor — Log in</title>
<style>
  :root{--bg:#0c1420;--surface:#121c2b;--line:#293544;--ink:#e9edf2;--muted:#9aa5b4;--brand:#7fa8d4;--danger:#f87171}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;height:100vh}
  form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px;width:280px;display:grid;gap:14px}
  h1{font-size:16px;margin:0 0 4px}
  label{font-size:12px;color:var(--muted);display:grid;gap:6px}
  input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--ink);font-size:14px}
  button{background:var(--brand);color:#0c1420;border:none;border-radius:6px;padding:10px;font-weight:700;cursor:pointer}
  #err{color:var(--danger);font-size:12px;min-height:14px}
</style>
</head>
<body>
<form id="f">
  <h1>🔍 GovBabu Monitor</h1>
  <label>Username <input id="username" autocomplete="username" required></label>
  <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
  <div id="err"></div>
  <button type="submit">Log in</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  if (res.ok) { window.location.href = '/'; return; }
  document.getElementById('err').textContent = 'Invalid username or password.';
});
</script>
</body>
</html>
